  BZT.forEach(k=>{if(!n[k])return;const rows=k==='cavalry'?2:Math.min(n[k],R0),cols=k==='cavalry'?Math.ceil(n[k]/4):Math.ceil(n[k]/rows);r[k]=rows;o[k]=run;run+=cols*CG+TG});
  const sq=Math.max(.3,Math.min(1,room/(Math.max(1,run-TG)*u0)));L[arr[0].s]={r,o,sq,dep:Math.max(1,run-TG)*u0*sq}});
 return L;
}
function bvSlot(L,u,sc,u0,my){

function bvUpd(sc,b,D){

const rnd=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mt=(f,n)=>f*Math.pow(2,n/12);

function ctx(){
 if(AU.ctx)return AU.ctx;
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  const c=new C(),cp=c.createDynamicsCompressor(),m=c.createGain(),s=c.createGain(),b=c.createGain();
  cp.threshold.value=-16;cp.knee.value=18;cp.ratio.value=9;cp.attack.value=.004;cp.release.value=.22;
  m.gain.value=1;s.gain.value=SFX_VOL;b.gain.value=0;
  s.connect(m);b.connect(m);m.connect(cp);cp.connect(c.destination);
  AU.ctx=c;AU.master=m;AU.sfx=s;AU.bgm=b;return c;
 }catch(e){return null}
}
const isMute=()=>typeof MUTE!=='undefined'&&MUTE;
function live(){
 if(isMute())return null;
 const c=ctx();if(!c)return null;
 if(c.state==='suspended'){try{c.resume()}catch(e){}}

}
function nbuf(c){

function tone(c,dst,t,dur,type,f0,f1,vol,att,det){
 const o=c.createOscillator(),g=c.createGain();att=att||.004;
 o.type=type;o.frequency.setValueAtTime(f0,t);
 if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(10,f1),t+dur);
 if(det)o.detune.value=det;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dst);o.start(t);o.stop(t+dur+.03);
}

 s.buffer=nbuf(c);s.loop=true;
 f.type=ft;f.frequency.setValueAtTime(Math.max(20,f0),t);
 if(f1&&f1!==f0)f.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);

 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

}

 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 car.connect(g);g.connect(dst);car.start(t);mod.start(t);car.stop(t+dur+.03);mod.stop(t+dur+.03);
}

const GAP={bow:.13,spear:.14,sword:.09,shield:.16,thunk:.11,boom:.35,hoof:.45,cry:.7};
function gate(c,k,dl){

 for(let i=0;i<q.length;i++)if(Math.abs(q[i]-t)<g)return -1;

}
const SND={

  noz(c,d,t+.03,.5,'bandpass',3200*p,700,.9,.07*v,.12);

  noz(c,d,t,.03,'bandpass',2500,1500,2,.04*v,.001);
  tone(c,d,t+.005,.12,'sine',(420+rnd()*120)*p,380*p,.03*v,.001);
 },
 // 창 찌르기: 바람 소리 → 갑옷/방패 충격 → 촉 긁힘 + 자루 떨림

  noz(c,d,t2,.09,'lowpass',1500,250,.8,.13*v,.002);
  noz(c,d,t2,.04,'highpass',3000,2500,.7,.05*v,.001);
  tone(c,d,t2,.15,'triangle',(260+rnd()*80)*p,200*p,.03*v,.002);

   [1,2.32,3.87,5.41,7.1].forEach((m,i)=>{const fr=f*m*(1+(rnd()-.5)*.05);if(fr<11000)tone(c,d,tt,.06+.22/(i+1)*(.6+rnd()*.8),'sine',fr,fr*.998,.045*v*s/(1+i*.5),.0008)});

  tone(c,d,t,.22,'sine',120*p,45,.28*v,.002);
  noz(c,d,t,.12,'lowpass',1100,200,.8,.2*v,.002);
  noz(c,d,t,.07,'bandpass',(550+rnd()*200)*p,350,3,.12*v,.001);
  noz(c,d,t,.025,'highpass',3500,3000,.7,.05*v,.001);
 },
 // 양군 격돌: 저음 진동 + 대군이 부딪히는 웅성임
 boom(c,t,v){const d=AU.sfx;
  tone(c,d,t,.45,'sine',80,32,.3*v,.004);
  noz(c,d,t,.8,'lowpass',900,120,.7,.2*v,.02);
  noz(c,d,t+.02,.5,'bandpass',1800,600,.6,.06*v,.03);

};
// 군중 함성: 서로 다른 음높이·시작 시점의 목소리 16명 + 숨소리 노이즈

 [f1,f2,f3].forEach(f=>f.connect(lp));lp.connect(out);out.connect(AU.sfx);

// 말발굽: 3박 구보 리듬(따각-따각-따각 … 쉼), 흙 충격음 + 딱 하는 접지음 + 가끔 마구 짤랑임
function hoof(c,t,v,n){

  const tt=t+Math.floor(i/3)*.42+OF[i%3]+rnd()*.01;
  tone(c,d,tt,.1,'sine',95+rnd()*35,50,.09*v,.002);
  noz(c,d,tt,.07,'lowpass',700,150,.8,.08*v,.002);
  noz(c,d,tt,.02,'bandpass',1500+rnd()*500,1200,3,.03*v,.001);
  if(rnd()<.25)noz(c,d,tt,.06,'highpass',5000,4200,.7,.02*v,.002);

function snd(k,v,dl){
 if(isMute())return;

 try{
  const t=gate(c,k,dl);if(t<0)return;
  const p=1+(rnd()-.5)*.2;v=(v==null?1:v)*(.8+rnd()*.35);
  if(k==='cry')cry(c,t,v,1.4+rnd()*.8);
  else if(k==='hoof')hoof(c,t,v,5+(rnd()*3|0));
  else SND[k](c,t,v,p);

}

const PROG=[{r:73.42,m:1},{r:58.27,m:0},{r:49,m:1},{r:55,m:0},{r:73.42,m:1},{r:58.27,m:0},{r:65.41,m:0},{r:55,m:0}];
const ACC=[1,.55,.75,.55,.95,.55,.75,.85];
const OST=[0,0,12,0,7,0,12,7,0,0,12,0,7,12,7,-1];
function bassNote(c,d,t,f,acc){

 lp.type='lowpass';lp.Q.value=6;lp.frequency.setValueAtTime(240+acc*1700,t);lp.frequency.exponentialRampToValueAtTime(170,t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05+acc*.1,t+.007);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 lp.connect(g);g.connect(d);
 [['sawtooth',f,0,.55],['square',f,7,.4],['sine',f/2,0,.9]].forEach(([ty,fr,dt,gn])=>{const o=c.createOscillator(),og=c.createGain();o.type=ty;o.frequency.value=fr;o.detune.value=dt;og.gain.value=gn;o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.03)});

function strNote(c,d,t,f,acc,dur,vol){

 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*(.45+acc*.7),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 lp.connect(g);g.connect(d);
 [-9,9].forEach(dt=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+dur+.03)});

function brass(c,d,t,dur,f0,vol){

  const o=c.createOscillator(),og=c.createGain(),f=f0*m;o.type='sawtooth';
  o.frequency.setValueAtTime(f*.965,t);o.frequency.exponentialRampToValueAtTime(f,t+.055);o.detune.value=dt+(rnd()-.5)*4;
  og.gain.value=.25/(1+i*.35);o.connect(og);og.connect(lp);o.start(t);o.stop(t+dur+.05);

}
function pad(c,d,t,dur,r,m){
 const lp=c.createBiquadFilter(),g=c.createGain();lp.type='lowpass';lp.frequency.value=800;lp.Q.value=.6;

 lp.connect(g);g.connect(d);

const kick=(c,d,t,v)=>{tone(c,d,t,.3,'sine',135,42,.45*v,.003);noz(c,d,t,.12,'lowpass',320,110,.8,.2*v,.003)};
const snare=(c,d,t,v)=>{noz(c,d,t,.17,'bandpass',2400,1000,.9,.2*v,.002);tone(c,d,t,.13,'triangle',200,120,.12*v,.002)};
const tick=(c,d,t,v)=>noz(c,d,t,.03,'highpass',7800,7200,.7,.05*v,.001);
const riser=(c,d,t,dur)=>noz(c,d,t,dur,'bandpass',500,9000,1.3,.16,dur*.96);

function bgStep(c,st,t){
 const bar=Math.floor(st/16)%8,s=st%16,P=PROG[bar],r=P.r,m=P.m,hot=bar>=4,D=AU.bgm;
 if(s%2===0){const i=s/2;let f=r;if(i===6&&bar%2)f=r*1.5;else if(i===7&&bar%2)f=r*2;bassNote(c,D,t,f,ACC[i])}
 {const o=OST[s],off=o<0?(m?3:4):o,f=mt(r*2,off),acc=s%4===0?1:(s%2===0?.7:.5);strNote(c,D,t,f,acc,STEP*.85,.055);if(hot)strNote(c,D,t,f*2,acc*.8,STEP*.8,.028)}
 if(s===0)brass(c,D,t,STEP*(bar%2?3.4:5.2),r*2,.075);
 if(s===10&&(hot||bar%2))brass(c,D,t,STEP*2.2,r*2,.06);
 if(s===12&&(bar===3||bar===7))brass(c,D,t,STEP*4,r*2,.085);

function bgTick(){
 const B=AU.bg,c=AU.ctx;if(!c||!B.on)return;

 if(B.mute!==want){B.mute=want;AU.master.gain.setTargetAtTime(want,c.currentTime,.05)}
 if(c.state!=='running'){try{c.resume()}catch(e){}return}
 const now=c.currentTime;
 if(B.next<now-.1)B.next=now+.05;
 while(B.next<now+.3){if(!mute){try{bgStep(c,B.step,B.next)}catch(e){}}B.next+=STEP;B.step++}
}
function bgmStart(){
 const c=ctx();if(!c)return;try{c.resume()}catch(e){}
 const B=AU.bg,g=AU.bgm.gain,t=c.currentTime;
 if(B.on&&!B.stopping)return;
 if(B.stopping){clearTimeout(B.killT);B.stopping=false;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(BGM_VOL,t+.4);return}
 B.on=true;B.step=0;B.next=t+.08;B.mute=-1;
 g.cancelScheduledValues(t);g.setValueAtTime(0,t);g.linearRampToValueAtTime(BGM_VOL,t+.5);

}

 const g=AU.bgm.gain,t=c.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(0,t+sec);
 clearTimeout(B.killT);B.killT=setTimeout(()=>{clearInterval(B.timer);B.on=false;B.stopping=false},sec*1000+120);
}

const unlock=()=>{const c=ctx();if(c&&c.state==='suspended'){try{c.resume()}catch(e){}}};

function initU(u){
 u.sp=.82+rnd()*.36;u.sd=rnd()*.55;u.wf=1.1+rnd()*1.3;u.wa=.8+rnd()*1.8;u.jx=(rnd()-.5)*4;u.jy=(rnd()-.5)*3;

 u.ar=(u.k==='bow'?1.1:u.k==='spear'?2.1:u.k==='shield'?1.7:u.k==='cavalry'?2.3:2.7)*(.8+rnd()*.4);
}
function wpx(k,p){

}

function impact(sc,u,d,E,u0,so){

bvUpd=function(sc,b,D){
 const W=sc.W,H=sc.H,u0=Math.max(.5,Math.min(H/540,W/820))*(sc.mx>40?1-.3*Math.min(1,(sc.mx-40)/50):1),a=sc.an,cl=a?Math.pow(Math.sin(Math.min(1,sc.p)*Math.PI),.6):0,tac=sc.tac,pl=b.playerSide;
 sc.u=u0;sc.y0=H*.62;sc.y1=H*.9;
 const gapT=(b.ri>0||a)?.04:.3;sc.gap+=(gapT-sc.gap)*Math.min(1,D*1.3);sc.shift+=(sc.advT-sc.shift)*Math.min(1,D*1.5);
 const fx=W*(.42+.1*sc.shift),ret=sc.retT>=0?Math.min(1,sc.retT):0,my=(sc.y0+sc.y1)/2;sc.fx0=fx;const LY=bvLay(sc,fx,u0,tac);
 if(a&&!a.zs){a.zs=1;roundSnd(sc,b,a)}
 const ev1=a&&a.r.ev===1?(a.r.es?'A':'B'):'',fireS=tac==='fire'&&b.st.fire>0?b.st.tacSide:'',so=!sc.skip,dD=Math.max(D,1e-4),inClash=cl>.12;
 [sc.A,sc.B].forEach(arr=>arr.forEach(u=>{
  if(u.sp==null)initU(u);
  const d=u.s==='A'?1:-1,k=u.k,E=u.s==='A'?sc.B:sc.A;
  if(!u.al){
   if(u.dd>0)u.dd-=D;
   else{
    if(u.fl>=1||u.x==null)return;
    if(u.fl<=0)u.fl=.001;
    u.fl=Math.min(1,u.fl+D*1.35);
    u.x+=u.dvx*D;u.y+=u.dvy*D;const f=Math.max(0,1-D*3.4);u.dvx*=f;u.dvy*=f;u.mv=0;u.w=0;u.at=0;
    if(u.fl>=1){u.fl=1;sc.corp.push({x:u.x,y:u.y,s:u.s,r:(rnd()-.5)*.6})}
    return;
   }
  }
  const sl=bvSlot(LY[u.s],u,sc,u0,my);
  let tx=fx-d*(sc.gap*W/2+sl[0])+Math.sin(sc.t*u.wf+u.ph)*u.wa*u0+u.jx*u0,ty=sl[1]+Math.cos(sc.t*u.wf*.83+u.ph*1.3)*u.wa*.55*u0+u.jy*u0;
  const dp=clamp(sl[0]/(LY[u.s].dep||1),0,1);
  let free=true,moved=0,eng=(k==='bow'||k==='gen')?0:Math.max(.2,1-dp*1.15);
  if(k==='cavalry'){
   if(sc.ro||ret>0){if(u.cs<3)u.cs=3}
   else{
    const fl=u.i%2,cc=(u.i>>1)%5,rw=Math.floor((u.i>>1)/5),px=fx+d*(sc.gap*W/2+(4+cc*8+(rw%2)*4)*u0),py=fl?sc.y1+(7+rw*7)*u0:sc.y0-(7+rw*7)*u0;
    if(u.cs===0&&a&&u.x!=null&&(b.ri>0||sc.p>.03)&&sc.t>=u.sd){u.cs=1;u.ct=0;u.c0=[u.x,u.y]}
    if(u.cs===1){
     free=false;
     u.ct=Math.min(1,u.ct+D*u.sp/2.0);
     const e=u.ct*(.35+.65*u.ct),x0=u.c0[0],y0=u.c0[1],cx=(x0+px)/2,cy=fl?Math.max(y0,py)+26*u0:Math.min(y0,py)-26*u0,m=1-e;
     const nx=m*m*x0+2*m*e*cx+e*e*px,ny=m*m*y0+2*m*e*cy+e*e*py;

     if(rnd()<D*8&&sc.fx.length<230)sc.fx.push({ty:'du',x:u.x-d*10*u0,y:u.y,t:0,T:.8,r:5*u0});
     if(so)snd('hoof',.8);
     if(u.ct>=1){u.cs=2;impact(sc,u,d,E,u0,so)}
    }else if(u.cs===2){tx=px+Math.sin(sc.t*u.wf+u.ph)*1.4*u0;ty=py+Math.cos(sc.t*u.wf*.8+u.ph)*1.2*u0}
   }
   eng=u.cs===2?.85:0;
  }
  if(u.at<=0&&inClash&&k!=='gen'){
   if(k==='bow'){if(rnd()<D*1.1*cl)u.at=.001}
   else if(eng>0&&rnd()<D*1.5*cl*eng)u.at=.001;
  }
  if(u.at>0){const p0=u.at,hp=k==='bow'?.55:.3;u.at+=D*u.ar;if(p0<hp&&u.at>=hp)strike(sc,u,d,fx,W,u0,k,ev1,fireS,so);if(u.at>=1)u.at=0}
  u.w=wpx(k,u.at);
  if(u.rk>0)u.rk=Math.max(0,u.rk-D*4.2);
  else if(inClash&&eng>.25&&rnd()<D*.5*cl*eng)u.rk=.55+rnd()*.45;
  if(free){
   if(k!=='bow'&&k!=='gen')tx+=d*Math.max(0,u.w)*5*u0;
   tx-=d*u.rk*5*u0;
   let rate=sc.t<2.6?2.4:5,vmax=(k==='cavalry'?430:320)*u0*u.sp;
   if(ret>0&&u.s===pl)tx+=((u.s==='A'?-W*.2:W*1.2)-tx)*ret;
   if(sc.ro){rate=1.5;if(u.s===sc.ro)tx=sc.ro==='A'?-W*.2:W*1.2;else tx+=(sc.ro==='A'?-1:1)*W*.3}
   if(ret>0&&u.s===pl){rate=3;vmax*=1.5}
   if(u.x==null){u.x=d>0?-50*u0-rnd()*W*.3:W+50*u0+rnd()*W*.3;u.y=ty}
   else if(sc.t>=u.sd){
    const dx=tx-u.x,dy=ty-u.y,dist=Math.hypot(dx,dy);
    if(dist>.01){const stp=Math.min(dist,Math.min(dist*rate,vmax)*D),ox=u.x,oy=u.y;u.x+=dx/dist*stp;u.y+=dy/dist*stp;moved=Math.hypot(u.x-ox,u.y-oy)}
   }

  const tm=Math.min(1,moved/dD/(85*u0));u.mv+=(tm-u.mv)*Math.min(1,D*12);
  u.wp+=Math.min(2.2,moved/(5*u0*(k==='cavalry'?1.6:1)));
 }));
 if(tac==='fire'&&a&&b.ri===2&&sc.p<.9){const tgt=b.st.fire>0?(b.st.tacSide==='A'?'B':'A'):b.st.tacSide,dd=tgt==='A'?-1:1;for(let i=0;i<D*70;i++)if(sc.fx.length<260)sc.fx.push({ty:'fl',x:fx+dd*(W*.05+rnd()*W*.26),y:sc.y0+rnd()*(sc.y1-sc.y0),t:0,T:.7+rnd()*.5,r:(8+rnd()*10)*u0})}
 if(cl>.2&&rnd()<D*9*cl&&sc.fx.length<220)sc.fx.push({ty:'du',x:fx+(rnd()-.5)*50*u0,y:sc.y0+rnd()*(sc.y1-sc.y0),t:0,T:.8,r:6*u0});
 sc.fx=sc.fx.filter(f=>(f.t+=D)<f.T);sc.txt=sc.txt.filter(f=>(f.t+=D)<f.T);

bvHit=function(sc,b,r){
 const st=b.st,u=sc.u;
 [[sc.A,r.a,st.ia,1],[sc.B,r.b,st.ib,-1]].forEach(([arr,v,i0,d])=>{
  const n0=arr.filter(x=>x.k!=='gen').length,live=arr.filter(x=>x.al&&x.k!=='gen'),tg=v<=0?0:Math.max(1,Math.round(n0*v/i0));
  live.map(x=>[COL[x.k]+rnd()*2.6,x]).sort((p,q)=>p[0]-q[0]).slice(0,Math.max(0,live.length-tg)).forEach(([,x])=>{
   x.al=0;x.fl=0;x.dd=rnd()*.9;x.dvx=-d*(55+rnd()*120)*u;x.dvy=(rnd()-.5)*36*u;
  });
  arr.forEach(x=>{if(x.al&&x.k!=='gen'&&rnd()<.4)x.rk=Math.max(x.rk||0,.8+rnd()*.6)});
 });
 const fx=sc.fx0,my=(sc.y0+sc.y1)/2;
 for(let i=0;i<34;i++)sc.fx.push({ty:'sp',x:fx+(rnd()-.5)*50*u,y:sc.y0+rnd()*(sc.y1-sc.y0)-20*u,vx:(rnd()-.5)*260,vy:-rnd()*220,t:0,T:.5+rnd()*.5});
 sc.txt.push({x:fx-70*u,y:my-30*u,t:0,T:1.7,s:'-'+fmt(r.la),col:'#fca5a5'},{x:fx+70*u,y:my-30*u,t:0,T:1.7,s:'-'+fmt(r.lb),col:'#fca5a5'});
 sc.sa=r.a;sc.sb=r.b;sc.advT=Math.max(-1,Math.min(1,(r.a/st.ia-r.b/st.ib)*2.5));

 if(!sc.skip){
  const sw=al('infantry')+al('cavalry'),sp=al('spear'),sh=al('shield'),bw=al('bow');
  for(let i=0;i<4;i++){
   if(sw)snd('sword',.9,.08+i*.15);
   if(sh)snd('shield',.9,.05+i*.2);
   if(sp)snd('spear',.8,.12+i*.17);

bvU=function(g,sc,u,col){
 const y=u.y,k=u.k,s=sc.u*(.85+.3*(y-sc.y0)/(sc.y1-sc.y0))*(k==='gen'?1.5:1),d=u.s==='A'?1:-1,t=sc.t,dk='#14100e';
 const mv=u.mv||0,wp=u.wp||0,w=u.w||0,rk=u.rk||0,atk=u.at>0;
 g.save();g.translate(u.x,y);
 if(u.fl>0){
  const e=1-Math.pow(1-u.fl,2.2);
  g.translate(0,-Math.sin(Math.min(1,u.fl*1.5)*Math.PI)*6*s);g.rotate(-d*e*1.5);g.globalAlpha=1-u.fl*.2;
 }
 g.scale(s,s);
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(0,0,12,3.5,0,0,6.3);g.fill();
 g.fillStyle=dk;g.strokeStyle=dk;g.lineCap='round';g.lineWidth=2.6;
 if(k==='cavalry'){
  const run=mv,bob=-Math.abs(Math.sin(wp))*3*run,chg=u.cs===1;
  g.save();g.translate(0,bob);
  g.beginPath();g.ellipse(0,-17,17,7,0,0,6.3);g.fill();
  const nk=chg?3:0;
  g.beginPath();g.moveTo(d*12,-20);g.lineTo(d*21,-33+nk);g.lineTo(d*27,-29+nk);g.lineTo(d*17,-13);g.fill();
  g.lineWidth=2;g.beginPath();g.moveTo(-d*17,-19);g.lineTo(-d*(24+run*3),-12-run*4+Math.sin(t*9+u.ph)*2);g.stroke();
  g.restore();
  g.lineWidth=2.4;
  [-12,-6,8,13].forEach((x,i)=>{
   const sw=Math.sin(wp+i*1.45+(i>1?.8:0))*(1.2+6.5*run),lift=Math.max(0,Math.cos(wp+i*1.45))*4*run;
   g.beginPath();g.moveTo(x,-14+bob);g.lineTo(x+sw,-lift);g.stroke();
  });
  g.save();g.translate(0,bob-24);g.rotate(d*(.15*run+(chg?.1:0)-.22*rk));
  g.fillStyle=dk;g.fillRect(-3,-13,6,15);g.beginPath();g.arc(0,-16,4.2,0,6.3);g.fill();
  g.fillStyle=col;g.beginPath();g.moveTo(-3,-12);g.lineTo(-d*(12+run*8),-6+Math.sin(t*12+u.ph)*3);g.lineTo(-3,-2);g.fill();

   g.beginPath();g.moveTo(q*2,-14+bob);g.lineTo(fx_,-lift);g.stroke();
  }
  const lean=d*(.13*mv+.22*lunge-.07*Math.min(0,w))-d*rk*.28;

  g.fillStyle=col;g.fillRect(-4.8,-26,9.6,2.6);
  g.beginPath();g.moveTo(-4,-16);g.lineTo(-d*(11+mv*5),-9+Math.sin(t*8+u.ph)*3);g.lineTo(-d*9,3);g.lineTo(-4,-1);g.fill();
  g.fillStyle=dk;g.lineWidth=2.2;
  if(k==='shield'){const sx=d*(5+lunge*5+rk*1.5);g.fillRect(sx-5,-21,10,26);g.strokeStyle=col;g.lineWidth=1.6;g.strokeRect(sx-5,-21,10,26)}
  else if(k==='spear'){
   const sx=-d*8+d*w*10,tx2=d*(28+w*16),ty2=-12;

   g.beginPath();g.moveTo(tx2,ty2+2);g.lineTo(tx2+d*8,ty2);g.lineTo(tx2,ty2-2);g.fill();
  }
  else if(k==='infantry'){
   const an=atk?-1.3+(w+.35)*1.37:-1.1;
   g.beginPath();g.moveTo(d*3,-10);g.lineTo(d*(3+Math.cos(an)*20),-10+Math.sin(an)*20);g.stroke();
  }
  else if(k==='bow'){
   g.beginPath();g.arc(d*8,-10,11,d>0?-1.2:Math.PI-1.2,d>0?1.2:Math.PI+1.2);g.stroke();
   const nx=d*(10-w*9);g.lineWidth=1.2;
   g.beginPath();g.moveTo(d*12,-20.25);g.lineTo(nx,-10);g.lineTo(d*12,.25);g.stroke();

  }
  else{
   g.beginPath();g.moveTo(d*3,-10);g.lineTo(d*16,-20);g.stroke();g.fillStyle=col;
   if(sc.ro===u.s){g.beginPath();g.moveTo(-d*8,-20);g.lineTo(-d*8,-42);g.lineTo(-d*20,-36);g.stroke();g.beginPath();g.moveTo(-d*20,-36);g.lineTo(-d*20,-24);g.lineTo(-d*30,-30);g.fill()}
   else{g.beginPath();g.moveTo(-d*8,-20);g.lineTo(-d*8,-66);g.stroke();g.beginPath();g.moveTo(-d*8,-66);for(let i=1;i<=5;i++)g.lineTo(-d*(8+i*5),-66+Math.sin(t*6+i*.9)*3+i*.7);for(let i=5;i>=1;i--)g.lineTo(-d*(8+i*5),-52+Math.sin(t*6+i*.9)*3+i*.7);g.lineTo(-d*8,-52);g.fill()}

const pInit=bvInit,pSync=bvSync,pConf=confirmBt;
